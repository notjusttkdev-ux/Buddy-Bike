[project]
name = "buddy-bike-chatbot"
version = "2.0.0"
description = "แชตบอตร้านเช่ารถจักรยานยนต์ Buddy Bike — Ride Now! (RAG + Vision อ่านสลิป + Llama Guard 4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pythainlp>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
