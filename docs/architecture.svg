<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 920" width="1520" height="920" font-family="'IBM Plex Sans Thai','Leelawadee UI','Noto Sans Thai',Tahoma,Loma,sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c2321"/></marker></defs>
<rect width="1520" height="920" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="600" fill="#1c2321" text-anchor="start">แผนภาพสถาปัตยกรรม: Buddy Bike Chatbot</text>
<text x="30" y="64" font-size="14" font-weight="400" fill="#5d6763" text-anchor="start">แต่ละกล่องคือไฟล์หรือโฟลเดอร์จริงในโปรเจกต์ และทุก endpoint ในภาพทำงานจริง</text>
<rect x="30" y="215" width="280" height="235" rx="12" fill="#e8f0fb" stroke="#9aa39f" stroke-width="1.5"/>
<text x="46" y="243" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">Browser ของลูกค้า</text>
<text x="46" y="263" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">หน้าเว็บแชต (UI)</text>
<text x="46" y="286" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">static/index.html</text>
<text x="46" y="309" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">static/style.css</text>
<text x="46" y="332" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">static/chat.js</text>
<text x="46" y="355" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start"></text>
<text x="46" y="378" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">หน้าจอเริ่มต้น, ภาพกำลังคิด,</text>
<text x="46" y="401" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">แถบแจ้งปัญหา, แนบสลิป</text>
<rect x="30" y="520" width="280" height="153" rx="12" fill="#e8f0fb" stroke="#9aa39f" stroke-width="1.5"/>
<text x="46" y="548" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">เจ้าหน้าที่ร้าน</text>
<text x="46" y="568" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">ผู้ตรวจสอบการชำระเงิน</text>
<text x="46" y="591" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">เปิดดูรายการสลิป (ADMIN_TOKEN)</text>
<text x="46" y="614" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">รับแจ้งเตือนทาง LINE</text>
<text x="46" y="637" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ตอบลูกค้าใน LINE OA Manager</text>
<rect x="30" y="715" width="280" height="160" rx="12" fill="#fde9e2" stroke="#9aa39f" stroke-width="1.5"/>
<text x="46" y="743" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">LINE Platform</text>
<text x="46" y="763" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">LINE Messaging API</text>
<text x="46" y="786" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ลูกค้าแชตกับ LINE OA</text>
<text x="46" y="809" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ส่ง webhook มาที่ /line/webhook</text>
<text x="46" y="832" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">Reply API: ตอบลูกค้า</text>
<text x="46" y="855" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">Push API: แจ้งเจ้าหน้าที่</text>
<rect x="370" y="90" width="770" height="800" rx="16" fill="#fafaf7" stroke="#1c2321" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="390" y="118" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">Backend: FastAPI รันใน Docker บน Render</text>
<rect x="390" y="135" width="730" height="223" rx="12" fill="#e3f1ee" stroke="#9aa39f" stroke-width="1.5"/>
<text x="406" y="163" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">app/main.py</text>
<text x="406" y="183" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">API Endpoint ทั้งหมดของระบบ (เว็บและ LINE ใช้ลำดับเดียวกัน)</text>
<text x="406" y="206" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">GET  /                  หน้าเว็บแชต</text>
<text x="406" y="229" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">GET  /health            ตรวจว่าระบบพร้อม และดูการตั้งค่า</text>
<text x="406" y="252" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">POST /api/chat          รับข้อความ หรือรูปสลิป แล้วส่งคำตอบกลับ</text>
<text x="406" y="275" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">POST /api/reset         ล้างประวัติบทสนทนา</text>
<text x="406" y="298" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">GET  /api/kb/search     ดูผลการค้นคลังความรู้ (ตรวจ RAG)</text>
<text x="406" y="321" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">GET  /api/slips         รายการสลิป สำหรับเจ้าหน้าที่เท่านั้น</text>
<text x="406" y="344" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">POST /line/webhook      รับข้อความและรูปสลิปจาก LINE OA</text>
<rect x="390" y="380" width="230" height="215" rx="12" fill="#fff5d9" stroke="#9aa39f" stroke-width="1.5"/>
<text x="406" y="408" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">app/safety/</text>
<text x="406" y="428" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">Safety / Guardrails</text>
<text x="406" y="451" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">blocklist.py + blocklist.txt</text>
<text x="406" y="474" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">rules.py  กฎ 3 ความเสี่ยง</text>
<text x="406" y="497" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">llama_guard.py</text>
<text x="406" y="520" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">categories.py  หมวด S1-S14</text>
<text x="406" y="543" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ตรวจขาเข้าและขาออก</text>
<text x="406" y="566" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">fail-closed</text>
<rect x="640" y="380" width="230" height="215" rx="12" fill="#eaf4e2" stroke="#9aa39f" stroke-width="1.5"/>
<text x="656" y="408" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">app/rag.py</text>
<text x="656" y="428" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">RAG: ค้นคลังความรู้</text>
<text x="656" y="451" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ตัดคำ PyThaiNLP</text>
<text x="656" y="474" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">เวกเตอร์ TF-IDF</text>
<text x="656" y="497" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">cosine similarity</text>
<text x="656" y="520" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">คืน 4 หัวข้อที่ตรงที่สุด</text>
<rect x="890" y="380" width="230" height="215" rx="12" fill="#f3e9f7" stroke="#9aa39f" stroke-width="1.5"/>
<text x="906" y="408" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">app/slip.py</text>
<text x="906" y="428" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">อ่านสลิปการโอนเงิน</text>
<text x="906" y="451" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ส่งรูปให้ Vision LLM</text>
<text x="906" y="474" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">แกะ JSON + ลองใหม่ 1 ครั้ง</text>
<text x="906" y="497" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ตรวจสลิปจริง ความชัด ชื่อผู้รับ</text>
<text x="906" y="520" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">แปลง พ.ศ. และยอดเงิน</text>
<text x="906" y="543" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">กันสลิปซ้ำ บันทึก CSV</text>
<rect x="390" y="640" width="230" height="130" rx="12" fill="#f1eee6" stroke="#9aa39f" stroke-width="1.5"/>
<text x="406" y="668" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">app/settings.py + .env</text>
<text x="406" y="688" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">การตั้งค่า</text>
<text x="406" y="711" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">API key และชื่อโมเดล</text>
<text x="406" y="734" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">สวิตช์เปิดปิดแต่ละด่าน</text>
<rect x="640" y="640" width="230" height="130" rx="12" fill="#f1eee6" stroke="#9aa39f" stroke-width="1.5"/>
<text x="656" y="668" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">knowledge/ + prompts/</text>
<text x="656" y="688" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">ข้อมูลร้านและคำสั่ง AI</text>
<text x="656" y="711" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">คลังความรู้ 80 หัวข้อ</text>
<text x="656" y="734" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">system prompt 2 โหมด</text>
<rect x="890" y="640" width="230" height="130" rx="12" fill="#f1eee6" stroke="#9aa39f" stroke-width="1.5"/>
<text x="906" y="668" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">data/ + uploads/</text>
<text x="906" y="688" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">บันทึกของเจ้าหน้าที่</text>
<text x="906" y="711" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">slips.csv</text>
<text x="906" y="734" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">รูปสลิปต้นฉบับ</text>
<rect x="390" y="800" width="355" height="72" rx="12" fill="#e3f1ee" stroke="#9aa39f" stroke-width="1.5"/>
<text x="406" y="828" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">app/line.py</text>
<text x="406" y="848" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">ตรวจลายเซ็น, Reply / Push, ข้อความแจ้งเจ้าหน้าที่</text>
<rect x="765" y="800" width="355" height="72" rx="12" fill="#e3f1ee" stroke="#9aa39f" stroke-width="1.5"/>
<text x="781" y="828" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">app/llm.py</text>
<text x="781" y="848" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">จุดเดียวที่เรียกโมเดล และแปล error เป็นภาษาไทย</text>
<rect x="1200" y="560" width="290" height="312" rx="12" fill="#fde9e2" stroke="#9aa39f" stroke-width="1.5"/>
<text x="1216" y="588" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">OpenRouter</text>
<text x="1216" y="608" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">ผู้ให้บริการโมเดล</text>
<text x="1216" y="631" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ตอบคำถาม</text>
<text x="1216" y="654" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">  openai/gpt-4o-mini</text>
<text x="1216" y="677" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">อ่านสลิป (Vision)</text>
<text x="1216" y="700" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">  google/gemini-2.5-flash</text>
<text x="1216" y="723" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ด่านตรวจความปลอดภัย</text>
<text x="1216" y="746" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">  meta-llama/llama-guard-4-12b</text>
<text x="1216" y="769" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start"></text>
<text x="1216" y="792" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">POST /chat/completions</text>
