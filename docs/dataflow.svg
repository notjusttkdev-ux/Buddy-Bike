<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 1316" width="1310" height="1316" font-family="'IBM Plex Sans Thai','Leelawadee UI','Noto Sans Thai',Tahoma,Loma,sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c2321"/></marker></defs>
<rect width="1310" height="1316" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="600" fill="#1c2321" text-anchor="start">แผนภาพการไหลของข้อมูลของ 1 ข้อความ: Buddy Bike Chatbot</text>
<text x="30" y="64" font-size="14" font-weight="400" fill="#5d6763" text-anchor="start">ตัวเลขคือลำดับขั้นตอน สีของกล่องบอกส่วนของระบบที่ทำงาน</text>
<circle cx="60" cy="138.0" r="20" fill="#1c2321"/>
<text x="60" y="144.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<rect x="110" y="96" width="720" height="84" rx="12" fill="#e8f0fb" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="120" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">BROWSER / LINE</text>
<text x="126" y="144" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">ลูกค้าพิมพ์คำถาม หรือแนบรูปสลิป ผ่านหน้าเว็บ หรือแชต LINE OA</text>
<text x="126" y="166" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">static/index.html หรือแอป LINE</text>
<line x1="470.0" y1="180" x2="470.0" y2="206" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="60" cy="248.0" r="20" fill="#1c2321"/>
<text x="60" y="254.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<rect x="110" y="206" width="720" height="84" rx="12" fill="#e8f0fb" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="230" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">BROWSER / LINE</text>
<text x="126" y="254" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">เว็บ: chat.js ส่ง POST /api/chat  |  LINE: ส่ง webhook มาที่ POST /line/webhook</text>
<text x="126" y="276" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">LINE: ตรวจลายเซ็น ตอบ 200 ทันที แล้วทำงานต่อเบื้องหลัง พร้อมแสดงสถานะกำลังพิมพ์</text>
<line x1="470.0" y1="290" x2="470.0" y2="316" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="60" cy="358.0" r="20" fill="#1c2321"/>
<text x="60" y="364.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<rect x="110" y="316" width="720" height="84" rx="12" fill="#e3f1ee" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="340" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">FASTAPI</text>
<text x="126" y="364" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">app/main.py: จำกัดจำนวนคำขอ ตรวจชนิดและขนาดรูปจากไบต์จริง สร้าง session</text>
<text x="126" y="386" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">ไม่ผ่าน: ตอบ 429 / 413 / 415 พร้อมข้อความภาษาไทย</text>
<line x1="470.0" y1="400" x2="470.0" y2="426" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="60" cy="468.0" r="20" fill="#1c2321"/>
<text x="60" y="474.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<rect x="110" y="426" width="720" height="84" rx="12" fill="#fff5d9" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="450" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">GUARD</text>
<text x="126" y="474" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">ด่านขาเข้า: blocklist &gt; กฎ Prompt Injection &gt; กฎ Sensitive Info &gt; Llama Guard 4</text>
<text x="126" y="496" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">app/safety/  ตัวตรวจล่ม = ไม่ผ่าน (fail-closed, ตอบ 503)</text>
<line x1="470.0" y1="510" x2="470.0" y2="536" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="60" cy="578.0" r="20" fill="#1c2321"/>
<text x="60" y="584.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<rect x="110" y="536" width="720" height="84" rx="12" fill="#e3f1ee" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="560" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">FASTAPI</text>
<text x="126" y="584" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">ปิดบังเลขส่วนตัวในข้อความ และติดป้ายคำอ้างที่ยืนยันไม่ได้</text>
<text x="126" y="606" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">rules.mask_pii และ rules.has_unverified_claim</text>
<line x1="470.0" y1="620" x2="470.0" y2="646" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="60" cy="688.0" r="20" fill="#1c2321"/>
<text x="60" y="694.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">6</text>
<rect x="110" y="646" width="720" height="84" rx="12" fill="#eaf4e2" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="670" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">RAG</text>
<text x="126" y="694" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">app/rag.py ค้นคลังความรู้: ตัดคำ &gt; TF-IDF &gt; cosine &gt; 4 หัวข้อที่ตรงที่สุด</text>
<text x="126" y="716" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">ได้ข้อมูลพร้อมรหัสอ้างอิง เช่น FAQ-07, BIKE-11, POL-03</text>
<line x1="470.0" y1="730" x2="470.0" y2="756" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="60" cy="798.0" r="20" fill="#1c2321"/>
<text x="60" y="804.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">7</text>
<rect x="110" y="756" width="720" height="84" rx="12" fill="#f3e9f7" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="780" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">LLM</text>
<text x="126" y="804" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">ประกอบ prompt แล้วเรียก openai/gpt-4o-mini ผ่าน app/llm.py</text>
<text x="126" y="826" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">system prompt + ประวัติ + &lt;วันเวลาปัจจุบัน&gt; + &lt;ข้อมูลร้าน&gt; + &lt;ข้อความลูกค้า&gt;</text>
<line x1="470.0" y1="840" x2="470.0" y2="866" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="60" cy="908.0" r="20" fill="#1c2321"/>
<text x="60" y="914.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">8</text>
<rect x="110" y="866" width="720" height="84" rx="12" fill="#fff5d9" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="890" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">GUARD</text>
<text x="126" y="914" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">ด่านขาออก: blocklist &gt; Prompt leak &gt; เลขส่วนตัว &gt; Misinformation &gt; Llama Guard 4</text>
<text x="126" y="936" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">ตัวเลขเงินต้องมีในคลังความรู้ ห้ามยืนยันการจองหรือการชำระเงิน</text>
<line x1="470.0" y1="950" x2="470.0" y2="976" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="60" cy="1018.0" r="20" fill="#1c2321"/>
<text x="60" y="1024.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">9</text>
<rect x="110" y="976" width="720" height="84" rx="12" fill="#e3f1ee" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="1000" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">FASTAPI</text>
<text x="126" y="1024" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">เก็บประวัติ แล้วตอบ JSON: type, reply, sources, guard, slip, elapsed_ms</text>
<text x="126" y="1046" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">log เฉพาะชนิดคำตอบ ด่านที่ทำงาน และเวลา ไม่เก็บข้อความลูกค้า</text>
<line x1="470.0" y1="1060" x2="470.0" y2="1086" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="60" cy="1128.0" r="20" fill="#1c2321"/>
<text x="60" y="1134.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">10</text>
<rect x="110" y="1086" width="720" height="84" rx="12" fill="#fde9e2" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="1110" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">LINE PUSH API</text>
<text x="126" y="1134" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">แจ้งเจ้าหน้าที่ทาง LINE: คำถามที่บอตตอบไม่ได้ และสรุปสลิปใหม่</text>
<text x="126" y="1156" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">ส่งคำถามที่ปิดบังเลขส่วนตัวแล้ว ข้อความที่ถูกด่านบล็อกไม่ถูกส่งต่อ</text>
<line x1="470.0" y1="1170" x2="470.0" y2="1196" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="60" cy="1238.0" r="20" fill="#1c2321"/>
<text x="60" y="1244.0" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">11</text>
<rect x="110" y="1196" width="720" height="84" rx="12" fill="#e8f0fb" stroke="#9aa39f" stroke-width="1.5"/>
<text x="126" y="1220" font-size="11.5" font-weight="600" fill="#5d6763" text-anchor="start">BROWSER / LINE</text>
<text x="126" y="1244" font-size="15" font-weight="600" fill="#1c2321" text-anchor="start">เว็บ: chat.js แสดงคำตอบด้วย textContent  |  LINE: ตอบด้วย Reply API</text>
<text x="126" y="1266" font-size="13.5" font-weight="400" fill="#5d6763" text-anchor="start">ถ้าเป็นสลิป แสดงสรุปยอด พร้อมสถานะรอเจ้าหน้าที่ตรวจสอบ</text>
<line x1="830" y1="468.0" x2="890" y2="468.0" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="860" y="460.0" font-size="12.5" font-weight="500" fill="#5d6763" text-anchor="middle">ไม่ผ่าน</text>
<rect x="890" y="412" width="350" height="112" rx="12" fill="#ffffff" stroke="#c98b00" stroke-width="1.5"/>
<text x="906" y="440" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">ตอบข้อความปฏิเสธทันที</text>
<text x="906" y="463" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ไม่เรียก RAG และไม่เรียกโมเดลตอบคำถาม</text>
<text x="906" y="486" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">guard = input / PROMPT_INJECTION ฯลฯ</text>
<line x1="830" y1="578.0" x2="890" y2="578.0" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="860" y="570.0" font-size="12.5" font-weight="500" fill="#5d6763" text-anchor="middle">มีรูป</text>
<rect x="890" y="542" width="350" height="312" rx="12" fill="#f3e9f7" stroke="#8d6aa8" stroke-width="1.5"/>
<text x="906" y="570" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">โหมดสลิป: app/slip.py</text>
<text x="906" y="590" font-size="12.5" font-weight="400" fill="#5d6763" text-anchor="start">ข้ามขั้นที่ 5-8</text>
<text x="906" y="613" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">- ส่งรูปให้ Vision LLM ตอบเป็น JSON</text>
<text x="906" y="636" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">- แกะ JSON ลองใหม่ได้ 1 ครั้ง</text>
<text x="906" y="659" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">- รูปเบลอหรือมืด: ขอรูปใหม่</text>
<text x="906" y="682" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">- ไม่ใช่สลิป หรืออ่านยอด/วันที่ไม่ได้: ไม่บันทึก</text>
<text x="906" y="705" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">- แปลง พ.ศ. เป็น ค.ศ. และยอดเงิน</text>
<text x="906" y="728" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">- ทิ้งข้อความในรูปที่เป็นคำสั่งหลอก</text>
<text x="906" y="751" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">- ผู้รับไม่ใช่บัญชีร้าน: สลิปไม่ถูกต้อง</text>
<text x="906" y="774" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">- กันสลิปซ้ำ แล้วบันทึก slips.csv</text>
<text x="906" y="797" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">- โค้ดสร้างข้อความตอบ: รอเจ้าหน้าที่ตรวจสอบ</text>
<text x="906" y="820" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">  (ไม่ยืนยันการชำระเงิน)</text>
<text x="906" y="843" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">แล้วไปขั้นที่ 9</text>
<line x1="830" y1="908.0" x2="890" y2="908.0" stroke="#1c2321" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="860" y="900.0" font-size="12.5" font-weight="500" fill="#5d6763" text-anchor="middle">ไม่ผ่าน</text>
<rect x="890" y="870" width="350" height="96" rx="12" fill="#ffffff" stroke="#c98b00" stroke-width="1.5"/>
<text x="906" y="898" font-size="16" font-weight="600" fill="#1c2321" text-anchor="start">แทนที่ด้วยข้อความปลอดภัย</text>
<text x="906" y="921" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ทิ้งคำตอบของ LLM ทั้งหมด</text>
<text x="906" y="944" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">guard = output / MISINFORMATION ฯลฯ</text>
<path d="M1240 468 L1270 468 L1270 1238.0 L834 1238.0" stroke="#1c2321" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>
<path d="M1240 918 L1270 918" stroke="#1c2321" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
<text x="1258" y="1228.0" font-size="12.5" font-weight="500" fill="#5d6763" text-anchor="end">ส่งข้อความปฏิเสธกลับไปหาลูกค้า</text>
</svg>
